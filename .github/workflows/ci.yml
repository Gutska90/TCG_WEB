name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tcg
          POSTGRES_PASSWORD: tcg
          POSTGRES_DB: tcg_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tcg -d tcg_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://tcg:tcg@localhost:5432/tcg_platform
      JWT_ACCESS_SECRET: ci-gate-jwt-access-secret-min-32-chars-ok
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm exec prisma migrate deploy
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Unit and integration tests
        env:
          NODE_ENV: test
        run: pnpm test
      - name: Integration tests (explicit)
        env:
          NODE_ENV: test
        run: pnpm test:integration
      - name: Build
        run: pnpm build
      - name: E2E web (Playwright)
        env:
          JWT_ACCESS_SECRET: ci-gate-jwt-access-secret-min-32-chars-ok
          ENABLE_REAL_PAYMENTS: "false"
          JOBS_ENABLED: "false"
          CORS_ORIGINS: http://localhost:3000,http://localhost:3002
          APP_WEB_URL: http://localhost:3000
          APP_ADMIN_URL: http://localhost:3002
          ENABLE_GOOGLE_AUTH: "true"
          ENABLE_APPLE_AUTH: "true"
          AUTH_STUB_OAUTH: "true"
          ENABLE_COLLECTIONS: "true"
          ENABLE_PRICES: "true"
          ENABLE_WISHLIST: "true"
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e
