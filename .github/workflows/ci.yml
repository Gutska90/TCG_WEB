name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          DATABASE_URL: postgresql://tcg:tcg@localhost:5432/tcg_platform
      - run: pnpm lint
        env:
          DATABASE_URL: postgresql://tcg:tcg@localhost:5432/tcg_platform
      - run: pnpm typecheck
        env:
          DATABASE_URL: postgresql://tcg:tcg@localhost:5432/tcg_platform
