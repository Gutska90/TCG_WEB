name: EAS Android preview (B6)

on:
  workflow_dispatch:

jobs:
  android-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: pnpm
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Require Android preview secrets
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
          EXPO_PUBLIC_API_BASE_URL: ${{ secrets.EXPO_PUBLIC_API_BASE_URL }}
        run: |
          test -n "$EXPO_TOKEN" || { echo "Falta secret EXPO_TOKEN"; exit 1; }
          test -n "$EAS_PROJECT_ID" || { echo "Falta secret EAS_PROJECT_ID"; exit 1; }
          test -n "$EXPO_PUBLIC_API_BASE_URL" || { echo "Falta secret EXPO_PUBLIC_API_BASE_URL"; exit 1; }
          case "$EXPO_PUBLIC_API_BASE_URL" in
            https://*) ;;
            *) echo "EXPO_PUBLIC_API_BASE_URL debe ser HTTPS de staging"; exit 1 ;;
          esac
      - name: Build internal APK (no Play submit)
        working-directory: apps/mobile
        env:
          EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
          EXPO_PUBLIC_API_BASE_URL: ${{ secrets.EXPO_PUBLIC_API_BASE_URL }}
          EXPO_PUBLIC_APP_ENV: staging
          EXPO_PUBLIC_ENABLE_REAL_PAYMENTS: "false"
          EXPO_PUBLIC_ANALYTICS: "false"
        run: eas build --profile preview --platform android --non-interactive --no-wait
