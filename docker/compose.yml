services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tcg
      POSTGRES_PASSWORD: tcg
      POSTGRES_DB: tcg_platform
    ports:
      - "5432:5432"
    volumes:
      - tcg_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tcg -d tcg_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  inbucket:
    image: inbucket/inbucket:latest
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "2500:2500"
      - "1100:1100"

volumes:
  tcg_postgres:
